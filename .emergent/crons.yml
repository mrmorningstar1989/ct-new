crons:
  - name: monthly-invoices
    description: "Gera mensalidades no dia 1 de cada mês para todos os alunos ativos com plano mensal"
    cron: "0 9 1 * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/invoices/cron/generate-monthly"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: whatsapp-reminders
    description: "Prepara lembretes de WhatsApp diários (08h) para mensalidades vencendo hoje e amanhã"
    cron: "0 8 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/reminders/cron/whatsapp-daily"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
